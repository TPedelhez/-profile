<title>Studio Truc Jazz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Kalam:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="studio.css">

<div class="app">
  <header class="top">
    <div class="brand">Studio <b>Truc Jazz</b><small>Parle piano avec Claude : il te montre les notes et te les fait entendre.</small></div>
    <button class="pill" id="newBtn" type="button">Nouvelle conversation</button>
  </header>

  <main id="thread" aria-live="polite"></main>

  <div class="dock-in">
    <div class="ideas" id="ideas">
      <button type="button" data-ask="Montre-moi un II-V-I en Fa avec des voicings sans fondamentale, et explique la différence avec les shells.">II-V-I sans fondamentale</button>
      <button type="button" data-ask="Quelle est la différence entre Dm7, D7 et Dmaj7 ? Montre-les côte à côte.">Dm7, D7, Dmaj7</button>
      <button type="button" data-ask="Apprends-moi une petite phrase blues en Do avec la note écrasée.">Une phrase blues</button>
      <button type="button" data-ask="Comment je fais une intro avec le turnaround I-VI-II-V ?">Une intro</button>
    </div>
    <form id="composer" autocomplete="off">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ta question</label>
      <textarea id="q" rows="1" placeholder="Pose ta question (ou dicte-la avec le micro du clavier)…" disabled></textarea>
      <button class="send" id="sendBtn" type="submit" disabled>Envoyer</button>
      <button class="stopb" id="stopBtn" type="button" hidden>Stop</button>
    </form>
    <div class="opts">
      <label for="speak" id="speakLbl"><input type="checkbox" id="speak" checked> Lire les réponses à voix haute</label>
      <label for="deep"><input type="checkbox" id="deep"> Réfléchir plus (plus lent)</label>
      <span id="status" role="status"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.1/dist/abcjs-basic-min.js"></script>
<script src="theory.js"></script>
<script src="tricks.js"></script>
<script src="audio.js"></script>
<script src="cards.js"></script>
<script src="studio.js"></script>
